apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-agents-api
  namespace: personal-agents-ns-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: personal-agents-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personal-agents-api
    spec:
      containers:
        - name: api
          image: kind-registry:5000/personal-agents/api:0.1.3
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: personal-agents-config
            - secretRef:
                name: neon-runtime
            - secretRef:
                name: agentmail-api-key
          readinessProbe:
            httpGet:
              path: /health
              port: 4000
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: personal-agents-api
  namespace: personal-agents-ns-1
spec:
  selector:
    app.kubernetes.io/name: personal-agents-api
  ports:
    - name: http
      port: 4000
      targetPort: 4000