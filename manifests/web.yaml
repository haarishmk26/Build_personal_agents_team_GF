apiVersion: apps/v1
kind: Deployment
metadata:
  name: personal-agents-web
  namespace: personal-agents-ns-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: personal-agents-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personal-agents-web
    spec:
      containers:
        - name: web
          image: localhost:5000/personal-agents/web:0.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: personal-agents-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
          livenessProbe:
            httpGet:
              path: /
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: personal-agents-web
  namespace: personal-agents-ns-1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: personal-agents-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000