apiVersion: batch/v1
kind: Job
metadata:
  name: personal-agents-db-migrate
  namespace: personal-agents-ns-1
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personal-agents-db-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: kind-registry:5000/personal-agents/api:0.1.0
          imagePullPolicy: Always
          command: ["node", "apps/api/scripts/migrate.mjs"]
          envFrom:
            - secretRef:
                name: neon-runtime